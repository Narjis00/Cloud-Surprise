<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mission Complete 💜</title>

    <link rel="stylesheet" href="last.css">

</head>

<body>

<audio id="bgMusic" loop>
    <source src="music/PrettyLittleFears.mp3" type="audio/mpeg">
</audio>

<div class="container">

    <!-- Envelope -->

    <div id="envelopeContainer">

        <div id="envelope">

            💌

        </div>

        <p class="clickText">
            Click the letter
        </p>

    </div>


    <!-- Letter -->

    <div id="letter" class="hidden">

        <div class="paper">

            <p id="letterText"></p>

        </div>

    </div>


    <!-- Small ending -->

    <div id="smallEnding" class="hidden">

        <p class="note">

            This website technically had no real ending because my favorite part is making new memories with you. 🤍

            <br><br>

            Hope you liked the journey.

        </p>

        <p id="psMessage"></p>

    </div>

</div>

<footer class="made-footer">
    for you, with 🤍 × 33
</footer>

<script src="last.js"></script>

</body>

</html>
